name: Application CI

on:
  pull_request:
    paths:
      - "CallMineAI-NextJS/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "CallMineAI-NextJS/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Validate, test, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: CallMineAI-NextJS

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: callmind_ci
          MYSQL_USER: callmind_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucallmind_ci -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      APP_ENV: test
      APP_DEMO_MODE: "false"
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_NAME: CallMindAI CI
      NEXT_PUBLIC_APP_NAME: CallMindAI CI
      DATABASE_URL: mysql://callmind_ci:ci-only-password@127.0.0.1:3306/callmind_ci?connection_limit=5&connect_timeout=5
      AUTH_SECRET: ci-only-auth-secret-with-more-than-32-characters
      CRON_SECRET: ci-only-cron-secret-with-more-than-32-characters
      APP_KEY: base64:Q0ktT05MWS1OT1QtQS1QUk9EVUNUSU9OLVNFQ1JFVA==

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CallMineAI-NextJS/package-lock.json

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to clean MySQL
        run: npx prisma migrate deploy

      - name: Run security policy tests
        run: npm run test:seed-policy

      - name: Test regional preference detection
        run: npm run test:regional-preferences

      - name: Validate translation dictionaries
        run: npm run test:locales

      - name: Lint source code
        run: npm run lint

      - name: Build production application
        env:
          NODE_ENV: production
          APP_ENV: production
          ADMIN_SEED_EMAIL: ci-admin@example.invalid
          ADMIN_SEED_PASSWORD: CI-Only-Password-2026!
        run: npm run build

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-diagnostics
          path: |
            CallMineAI-NextJS/.next/trace
            CallMineAI-NextJS/.next/server
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Build production container
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image without publishing
        uses: docker/build-push-action@v6
        with:
          context: CallMineAI-NextJS
          file: CallMineAI-NextJS/Dockerfile
          target: runtime
          push: false
          load: true
          tags: callmindai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_NAME=CallMindAI CI
            NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000

      - name: Smoke-test container and health endpoint
        shell: bash
        run: |
          docker run --detach --name callmindai-smoke \
            --publish 127.0.0.1:3100:3000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/.next/cache:rw,nosuid,size=128m,uid=1001,gid=1001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env DATABASE_URL='mysql://ci:ci@127.0.0.1:3306/unused?connect_timeout=1' \
            --env AUTH_SECRET='ci-only-auth-secret-with-more-than-32-characters' \
            --env CRON_SECRET='ci-only-cron-secret-with-more-than-32-characters' \
            --env APP_KEY='base64:Q0ktT05MWS1OT1QtQS1QUk9EVUNUSU9OLVNFQ1JFVA==' \
            callmindai:${{ github.sha }}

          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:3100/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs callmindai-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: |
          docker logs callmindai-smoke || true
          docker rm --force callmindai-smoke || true
