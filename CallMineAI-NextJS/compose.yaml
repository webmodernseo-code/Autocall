name: callmindai

x-app-common: &app-common
  image: callmindai:${IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
    args:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-CallMindAI}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3000}
  env_file:
    - .env
  init: true
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:mode=1777
    - /app/.next/cache:uid=1001,gid=1001,mode=0755
  networks:
    - application

services:
  web:
    <<: *app-common
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  worker:
    <<: *app-common
    command: ["node", "scripts/worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  migrate:
    image: callmindai-migration:${IMAGE_TAG:-local}
    build:
      context: .
      target: migration
    env_file:
      - .env
    restart: "no"
    profiles: ["tools"]
    networks:
      - application

networks:
  application:
    driver: bridge

